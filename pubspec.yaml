name: kaosure
description: "Kao ID — central identity, verification and governance for the Kao Ecosystem."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.18.2
  google_fonts: ^6.1.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  image_picker: ^1.1.2
  path: ^1.9.0
  file_picker: ^10.3.2
  image: ^4.5.4
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/kaosure_logo.png
